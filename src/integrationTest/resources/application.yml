spring:
  datasource:
    url: jdbc:h2:mem:integrationdb;DB_CLOSE_DELAY=-1;MODE=MYSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: H2
  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: test-jwt-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256
  expiration-ms: 86400000

stripe:
  secret-key: integration-test-placeholder
  webhook-secret: integration-webhook-placeholder
  currency: usd
  checkout-success-url: http://localhost/api/checkout/return?status=success
  checkout-cancel-url: http://localhost/api/checkout/return?status=cancelled

aws:
  region: us-east-1
  s3:
    bucket: test-bucket
    endpoint: http://localhost:4566
  sqs:
    # Overridden at runtime by @DynamicPropertySource
    queue-url: http://localhost:9324/000000000000/test-jobs
    endpoint: http://localhost:9324

payment-recovery:
  initial-delay-seconds: 1
  dispatch-interval-ms: 500
  dispatch-batch-size: 20
  stale-claim-seconds: 5
  publication-retry-delay-seconds: 1

worker:
  enabled: true
  poll-interval-ms: 500
  max-messages: 10
  visibility-timeout-seconds: 30
  retry-base-delay-seconds: 1
  retry-max-delay-seconds: 2
  retry-jitter-ratio: 0.0
