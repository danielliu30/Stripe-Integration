stages:
  - test

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: gradle
  paths:
    - .gradle/caches
    - .gradle/wrapper

unit-and-integration:
  stage: test
  image: gradle:8.12.1-jdk17
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  script:
    - bash -n localstack-init/init-aws.sh
    - test -x localstack-init/init-aws.sh
    - ./gradlew test integrationTest --rerun-tasks --no-daemon
  artifacts:
    when: always
    reports:
      junit:
        - build/test-results/test/TEST-*.xml
        - build/test-results/integrationTest/TEST-*.xml
    paths:
      - build/reports/tests/test
      - build/reports/tests/integrationTest

compose-smoke:
  stage: test
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    COMPOSE_INFRA_HOST: "docker"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  before_script:
    - apk add --no-cache bash curl openjdk17-jdk python3
  script:
    - ./scripts/compose-smoke.sh
  artifacts:
    when: always
    paths:
      - build/compose-smoke

stripe-e2e:
  stage: test
  image: gradle:8.12.1-jdk17
  resource_group: stripe-test-account
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  script:
    - ./gradlew stripeIntegrationTest --rerun-tasks --no-daemon
  artifacts:
    when: always
    reports:
      junit:
        - build/test-results/stripeIntegrationTest/TEST-*.xml
    paths:
      - build/reports/tests/stripeIntegrationTest
